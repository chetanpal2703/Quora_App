spring.application.name=quora-app
spring.datasource.url=jdbc:mysql://localhost:3306/Quora_App
spring.datasource.username=root
spring.datasource.password= root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=false

jwt.secret=your-super-long-secret-key-that-is-at-least-32-characters-long
jwt.expiration=60000

#used for fist time flyway
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1
#spring.flyway.baseline-description=Initial existing schema


#elastic search properties

elasticsearch.url=http://localhost:9200
elasticsearch.username=elastic
elasticsearch.password=${ELASTICSEARCH_PASSWORD}

# Logging Configuration
#logging.file.name=logs/quora-app.log


# Kafka cluster
spring.kafka.bootstrap-servers=localhost:19092,localhost:29092,localhost:39092

# Producer: send JSON strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Producer reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10

# Consumer
spring.kafka.consumer.group-id=quora-question-search
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topic and Outbox publishing
app.kafka.topics.question-events=question-events
app.outbox.publisher-delay-ms=5000


# Refresh token lifetime: 7 days, in milliseconds
app.auth.refresh-token-expiration=180000

# Cookie settings
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=Lax